[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-memory-mlx"
version = "0.1.0"
description = "Compile bounded company knowledge into auditable MLX LoRA adapters on Apple Silicon."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Philippe Dagher" }]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "rapidfuzz>=3.9,<4",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
mac = [
  "mlx-lm[train]==0.31.3",
]
semantic = [
  "mlx-embeddings==0.1.0",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
emmlx = "enterprise_memory_mlx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["enterprise_memory_mlx*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  "artifacts",
  "build",
  "dev",
  "dist",
  "*.egg-info",
  ".specstory",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
